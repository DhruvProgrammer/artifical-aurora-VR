<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Aurora AR: simulated northern lights rendered live over a camera feed">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040a16"/>
      <stop offset="0.55" stop-color="#071426"/>
      <stop offset="1" stop-color="#02040a"/>
    </linearGradient>
    <radialGradient id="skyGlow" cx="0.5" cy="0.05" r="0.85">
      <stop offset="0" stop-color="#18e0b0" stop-opacity="0.22"/>
      <stop offset="0.45" stop-color="#5b4bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18e0b0" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#35ffb8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#a855f7" stop-opacity="0.75"/>
      <stop offset="0.75" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#18e0b0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d9fff4"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#010307"/>
    </linearGradient>
    <filter id="blurXL" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blurL" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="blurM" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>
  <rect width="1280" height="440" fill="url(#skyGlow)"/>

