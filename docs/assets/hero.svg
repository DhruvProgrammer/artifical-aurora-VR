  <g fill="none" stroke-linecap="round">
    <path d="M-80 268 C 150 96 330 300 590 150 S 1020 54 1360 206" stroke="url(#green)" stroke-width="86" opacity="0.55" filter="url(#blurXL)"/>
    <path d="M-80 268 C 150 96 330 300 590 150 S 1020 54 1360 206" stroke="url(#green)" stroke-width="20" opacity="0.85" filter="url(#blurM)"/>
    <path d="M-60 210 C 210 330 380 70 640 208 S 1060 290 1340 120" stroke="url(#violet)" stroke-width="58" opacity="0.5" filter="url(#blurL)"/>
    <path d="M-60 210 C 210 330 380 70 640 208 S 1060 290 1340 120" stroke="url(#violet)" stroke-width="8" opacity="0.55" filter="url(#blurM)"/>
    <path d="M-40 300 C 260 200 420 340 700 240 S 1100 180 1320 280" stroke="url(#green)" stroke-width="30" opacity="0.35" filter="url(#blurL)"/>
  </g>

  <path d="M0 372 L88 340 L168 366 L262 322 L354 360 L448 334 L540 368 L636 338 L728 370 L820 330 L910 364 L1004 336 L1100 368 L1190 340 L1280 366 L1280 440 L0 440 Z" fill="url(#ridge)"/>
  <path d="M0 372 L88 340 L168 366 L262 322 L354 360 L448 334 L540 368 L636 338 L728 370 L820 330 L910 364 L1004 336 L1100 368 L1190 340 L1280 366" fill="none" stroke="#1de9b6" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect width="1280" height="440" fill="url(#vignette)"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="108" fill="#8ea3c0" font-size="13" font-weight="600" letter-spacing="5">ANDROID · AR CAMERA · REAL-TIME SHADER</text>
    <text x="640" y="206" fill="url(#title)" font-size="88" font-weight="800" letter-spacing="2">AURORA AR</text>
    <text x="640" y="252" fill="#d7e3f4" font-size="25" font-weight="400">The northern lights, rendered live over your camera.</text>
    <text x="640" y="284" fill="#8296b0" font-size="17" font-weight="400">Simulated aurora · SkyScore conditions · MP4 recording · 100% offline</text>
  </g>

